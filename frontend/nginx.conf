server {
    listen 80;
    root /usr/share/nginx/html;

    location /api/ {
        proxy_pass http://backend:8000;
        # The browser's host (with port): account writes compare it with the Origin header.
        proxy_set_header Host $http_host;
        # First analysis in a new area downloads terrain data (up to ~2 min).
        proxy_read_timeout 300s;
    }

    # MapLibre's module worker; nginx's default MIME table does not know .mjs.
    location ~* \.mjs$ {
        types { }
        default_type application/javascript;
    }

    location / {
        try_files $uri /index.html;
    }
}
